version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://user:password@db:5432/users_db
      FRONTEND_URL: http://your-production-domain.com
    secrets:
      - SECRET_KEY
      - ADMIN_MAIL
      - ADMIN_PASSWORD
    expose:
      - "5000"
    depends_on:
      - redis
      - db
    networks:
      - main
    volumes:
      - db_data:/app/instance

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - main

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - main

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - main

volumes:
  db_data:
  postgres_data:

networks:
  main:
    driver: bridge

secrets:
  SECRET_KEY:
    file: ./.env_prod_secrets/SECRET_KEY
  ADMIN_MAIL:
    file: ./.env_prod_secrets/ADMIN_MAIL
  ADMIN_PASSWORD:
    file: ./.env_prod_secrets/ADMIN_PASSWORD