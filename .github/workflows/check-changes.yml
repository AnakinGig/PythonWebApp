name: Check Code Changes

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      docker: ${{ steps.changes.outputs.docker }}
      any: ${{ steps.changes.outputs.any }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Detect changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF=${{ github.base_ref }}
            echo "Comparing PR against ${BASE_REF}"
            git diff --name-only origin/${BASE_REF}...HEAD > /tmp/changed_files.txt
          else
            echo "Comparing against HEAD~1"
            git diff --name-only HEAD~1 HEAD > /tmp/changed_files.txt
          fi
          
          cat /tmp/changed_files.txt
          
          # Check for backend changes
          if grep -q "^backend/" /tmp/changed_files.txt || grep -q "\.github/workflows/test-backend\.yml" /tmp/changed_files.txt; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for frontend changes
          if grep -q "^frontend/" /tmp/changed_files.txt || grep -q "\.github/workflows/test-frontend\.yml" /tmp/changed_files.txt; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi
          
          # Check for docker/infra changes
          if grep -q "^docker" /tmp/changed_files.txt || grep -q "Dockerfile" /tmp/changed_files.txt; then
            echo "docker=true" >> $GITHUB_OUTPUT
          else
            echo "docker=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if any code changed (not just docs/readme)
          if grep -vE "^\.(md|txt|yml)$|README|\.gitignore" /tmp/changed_files.txt | grep -q .; then
            echo "any=true" >> $GITHUB_OUTPUT
          else
            echo "any=false" >> $GITHUB_OUTPUT
          fi
