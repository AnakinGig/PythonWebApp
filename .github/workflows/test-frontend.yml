name: Frontend Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_call:  # Allow triggering from other workflows

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      previous-failure: ${{ steps.check-previous.outputs.failed }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check previous test failure
        id: check-previous
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test-frontend.yml',
                branch: context.ref.replace('refs/heads/', ''),
                status: 'completed',
                per_page: 1
              });
              const lastRun = runs.data.workflow_runs[0];
              if (lastRun && lastRun.conclusion === 'failure') {
                core.setOutput('failed', 'true');
              } else {
                core.setOutput('failed', 'false');
              }
            } catch (error) {
              console.log('Could not check previous runs:', error);
              core.setOutput('failed', 'false');
            }
      
      - name: Detect frontend changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF=${{ github.base_ref }}
            git diff --name-only origin/${BASE_REF}...HEAD > /tmp/changed_files.txt
          else
            git diff --name-only HEAD~1 HEAD > /tmp/changed_files.txt || echo "" > /tmp/changed_files.txt
          fi
          
          if grep -q "^frontend/" /tmp/changed_files.txt || grep -q "\.github/workflows/test-frontend\.yml" /tmp/changed_files.txt || [ ! -s /tmp/changed_files.txt ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.previous-failure == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false --passWithNoTests
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
